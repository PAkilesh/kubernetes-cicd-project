name: Project 5 CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app/app.py

      - name: Run automated tests
        working-directory: app
        run: |
          pytest -v

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t ghcr.io/pakilesh/kubernetes-cicd-project:${{ github.sha }} \
            ./app

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/pakilesh/kubernetes-cicd-project:${{ github.sha }}

      - name: Update Kubernetes image
        if: github.event_name == 'push'
        run: |
          sed -i \
            "s|image: ghcr.io/pakilesh/kubernetes-cicd-project:.*|image: ghcr.io/pakilesh/kubernetes-cicd-project:${{ github.sha }}|" \
            k8s/deployment.yaml

      - name: Commit deployment manifest
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          git diff --cached --quiet || \
          git commit -m "Deploy image ${{ github.sha }} [skip ci]"

          git push