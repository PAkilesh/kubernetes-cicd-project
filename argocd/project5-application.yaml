apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: project5
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/PAkilesh/kubernetes-cicd-project.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: project5

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
